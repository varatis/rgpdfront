app:
  name: minds-rgpd-front-ng-valid
  env: valid
  apiurl: "https://valid.minds-rgpd.minds.k8s/apims"
  ingress:
    interne:
      host: valid.minds-rgpd.minds.k8s
  keycloak:
    issuer: https://sso.minds.k8s/auth/realms/creative
    grant_type: "password"
    client_id: "minds-rgpd"
    realm: "creative"
  secret:
    path: saas_rgpd/valid/k8s
  nextAuthUrl: https://valid.minds-rgpd.minds.k8s
  tracing:
    endpoint: "http://jaeger-collector:4317"
    sampler: "always_on"
    samplerArg: "1.0"
    serviceName: "minds-rgpd-front-ng-valid"
