# Use root/example as user/password credentials
version: '3.4'

services:
  front:
    image: nginx:1.23.2
    container_name: minds-rgpd-front-ng
    ports:
      - "4200:80"
    volumes:
      - ${WORKSPACE}/.platforms/ci/dockerfiles/vhostNginx.conf:/etc/nginx/conf.d/default.conf
      - ${WORKSPACE}/dist/minds-rgpd-front-ng:/usr/share/nginx/html
      - ${WORKSPACE}/src/env.js:/usr/share/nginx/html/env.js


