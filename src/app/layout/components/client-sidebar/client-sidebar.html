@if (currentUser()) {
<div class="double-sidebar-container">
  <aside class="sidebar-mini">
    <div class="mini-header">
      <div class="logo-triangle">
        <img src="assets/images/group.png" alt="Agence" />
      </div>
    </div>

    <nav class="mini-nav">
      <a [routerLink]="null" class="mini-nav-item" (click)="toggleClientMenu()" title="Compte client">
        <mat-icon>business</mat-icon>
      </a>

      <a [routerLink]="null" class="mini-nav-item disabled" aria-disabled="true" tabindex="-1" title="Administrateurs">
        <mat-icon>admin_panel_settings</mat-icon>
      </a>

      <a [routerLink]="null" class="mini-nav-item disabled" aria-disabled="true" tabindex="-1"
         title="Gestion des préconisations">
        <mat-icon>tune</mat-icon>
      </a>
    </nav>

    <div class="mini-footer">
      <button class="mini-logout-btn" (click)="logout()" title="Se déconnecter">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </aside>

  @if (showClientMenu()) {
  <aside class="sidebar-main">
    <div class="sidebar-header">
      <div class="client-info">
        <div class="client-logo">
          <img [src]="logo()" [alt]="clientName()" />
        </div>
      </div>
      <button class="back-button" (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
        Retour à la liste des clients
      </button>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems(); track item.route) {
      <a [routerLink]="item.route" routerLinkActive="active" class="nav-item">
        <mat-icon class="nav-icon">{{ getIconName(item.icon) }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
      }
    </nav>
  </aside>
  }
</div>
}
