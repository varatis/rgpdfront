@if (currentUser()) {
<div class="double-sidebar-container">
  @if (isSuperAdmin()) {
  <aside class="sidebar-mini">
    <div class="mini-header">
      <div class="logo-triangle">
        <img src="assets/images/group.png" alt="Agence" />
      </div>
    </div>

    <nav class="mini-nav">
      @for (item of adminNavItems; track item.route) {
      <a
        [routerLink]="['/admin', item.route]"
        routerLinkActive="active"
        class="mini-nav-item"
        [title]="item.label"
        [attr.data-testid]="'_btn_admin_nav_' + item.route">
        <mat-icon>{{ getIconName(item.icon) }}</mat-icon>
      </a>
      }
    </nav>

    <div class="mini-footer">
      <button class="mini-logout-btn" (click)="logout()" title="Se déconnecter">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </aside>
  }

  <aside class="sidebar-main">
    <div class="sidebar-header">
      <div class="client-info">
        <div class="client-logo">
          <img data-testid="_val_logo_client" [src]="logo()" [alt]="clientName()" />
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems(); track item.route) {
      <a [routerLink]="item.route" routerLinkActive="active" class="nav-item">
        <mat-icon class="nav-icon">{{ getIconName(item.icon) }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
      }
    </nav>

    @if (!isSuperAdmin()) {
    <div class="sidebar-footer">
      <button class="logout-btn" data-testid="_btn_deconnexion" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Se déconnecter</span>
      </button>
    </div>
    }
  </aside>
</div>
}
