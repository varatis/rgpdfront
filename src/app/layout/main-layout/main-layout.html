<mat-sidenav-container class="main-layout">
  @if (currentUser()?.role === 'client' || currentUser()?.role === 'admin' || currentUser()?.role === 'superadmin'){
  <mat-sidenav mode="side" opened class="sidebar">
    <app-client-sidebar></app-client-sidebar>
  </mat-sidenav>
  }
  <mat-sidenav-content class="layout-body">
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
