<div class="preconisations-table">
  <!-- Header -->
  <div class="table-header">
    <div class="header-cell sortable" (click)="toggleSort('titre')">
      <span>PRÉCONISATION</span>
      <mat-icon class="sort-icon">sort</mat-icon>
    </div>

    <div class="header-cell sortable" (click)="toggleSort('prioriteLabel')">
      <span>PRIORITÉ</span>
      <mat-icon class="sort-icon">sort</mat-icon>
    </div>

    <div class="header-cell sortable" (click)="toggleSort('complexiteLabel')">
      <span>COMPLEXITÉ</span>
      <mat-icon class="sort-icon">sort</mat-icon>
    </div>

    <div class="header-cell sortable" (click)="toggleSort('avancement')">
      <span>AVANCEMENT</span>
      <mat-icon class="sort-icon">sort</mat-icon>
    </div>

    <div class="header-cell arrow-col"></div>
  </div>

  <!-- Body -->
  <div class="table-body">
    <div
      class="table-row"
      *ngFor="let item of sortedData"
      (click)="onRowClick(item)">

      <!-- Titre -->
      <div class="table-cell titre">
        {{ item.titre }}
      </div>

      <!-- Priorité avec badge -->
      <div class="table-cell priorite">
        <span class="badge" [ngClass]="getPrioriteClass(item.priorite)">
          {{ item.prioriteLabel }}
        </span>
      </div>

      <!-- Complexité avec badge -->
      <div class="table-cell complexite">
        <span class="badge" [ngClass]="getComplexiteClass(item.complexite)">
          {{ item.complexiteLabel }}
        </span>
      </div>

      <!-- Avancement avec barre de progression -->
      <div class="table-cell avancement">
        <div class="progress-wrapper">
          <div class="progress-bar">
            <div class="progress-fill" [style.width.%]="item.avancement"></div>
          </div>
          <span class="progress-text">{{ item.avancement }}%</span>
        </div>
      </div>

      <!-- Flèche -->
      <div class="table-cell arrow">
        <mat-icon>chevron_right</mat-icon>
      </div>
    </div>
  </div>
</div>
