<div class="table-container">
  <table mat-table [dataSource]="sortedData" class="mat-elevation-z0">

    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef [class.sortable]="true" (click)="toggleSort('id')">
        <div class="header-cell">
          <span>ID</span>
          <svg
            class="sort-icon"
            [class.active]="sortColumn === 'id'"
            [class.desc]="sortColumn === 'id' && sortDirection === 'desc'"
            width="10"
            height="6"
            viewBox="0 0 10 6"
            aria-hidden="true">
            <path
              d="M1 1l4 4 4-4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
      </th>
      <td mat-cell *matCellDef="let element" [class.selected]="element.id === selectedId" (click)="onSelect(element)">
        <div class="cell-content">
          <mat-icon class="shield-icon">shield</mat-icon>
          {{ element.id }}
        </div>
      </td>
    </ng-container>


    <!-- Treatment Column -->
    <ng-container matColumnDef="treatment">
      <th mat-header-cell *matHeaderCellDef [class.sortable]="true" (click)="toggleSort('treatment')">
        <div class="header-cell">
          <span>TRAITEMENT</span>
          <svg
            class="sort-icon"
            [class.active]="sortColumn === 'treatment'"
            [class.desc]="sortColumn === 'treatment' && sortDirection === 'desc'"
            width="10"
            height="6"
            viewBox="0 0 10 6"
            aria-hidden="true">
            <path
              d="M1 1l4 4 4-4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
      </th>
      <td mat-cell *matCellDef="let element" [class.selected]="element.id === selectedId" (click)="onSelect(element)">
        {{ element.treatment }}
      </td>
    </ng-container>

    <!-- Manager Column -->
    <ng-container matColumnDef="manager">
      <th mat-header-cell *matHeaderCellDef [class.sortable]="true" (click)="toggleSort('manager')">
        <div class="header-cell">
          <span>GESTIONNAIRE</span>
          <svg
            class="sort-icon"
            [class.active]="sortColumn === 'manager'"
            [class.desc]="sortColumn === 'manager' && sortDirection === 'desc'"
            width="10"
            height="6"
            viewBox="0 0 10 6"
            aria-hidden="true">
            <path
              d="M1 1l4 4 4-4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
      </th>
      <td mat-cell *matCellDef="let element" [class.selected]="element.id === selectedId" (click)="onSelect(element)">
        {{ element.manager }}
      </td>
    </ng-container>

    <!-- Purpose Column -->
    <ng-container matColumnDef="purpose">
      <th mat-header-cell *matHeaderCellDef [class.sortable]="true" (click)="toggleSort('purpose')">
        <div class="header-cell">
          <span>FINALITÉ PRINCIPALE</span>
          <svg
            class="sort-icon"
            [class.active]="sortColumn === 'purpose'"
            [class.desc]="sortColumn === 'purpose' && sortDirection === 'desc'"
            width="10"
            height="6"
            viewBox="0 0 10 6"
            aria-hidden="true">
            <path
              d="M1 1l4 4 4-4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
      </th>
      <td mat-cell *matCellDef="let element" [class.selected]="element.id === selectedId" (click)="onSelect(element)">
        {{ element.purpose }}
      </td>
    </ng-container>

    <!-- Arrow Column -->
    <ng-container matColumnDef="arrow">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element" [class.selected]="element.id === selectedId" (click)="onSelect(element)">
        <mat-icon>chevron_right</mat-icon>
      </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.selected-row]="row.id === selectedId"></tr>
  </table>
</div>
