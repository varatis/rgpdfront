<div class="pagination" *ngIf="totalPages > 1">
  
  <button 
    class="page-btn nav" 
    [disabled]="currentPage === 1" 
    (click)="pageChange.emit(1)"
    title="Première page">
    «
  </button>
  
  <button 
    class="page-btn nav" 
    [disabled]="currentPage === 1" 
    (click)="pageChange.emit(currentPage - 1)"
    title="Page précédente">
    ‹
  </button>
  
  <button 
    *ngFor="let page of visiblePages" 
    class="page-btn" 
    [class.active]="page === currentPage"
    [class.dots]="page === -1"
    [disabled]="page === -1"
    (click)="page !== -1 && pageChange.emit(page)">
    {{ page === -1 ? '...' : page }}
  </button>
  
  <button 
    class="page-btn nav" 
    [disabled]="currentPage === totalPages" 
    (click)="pageChange.emit(currentPage + 1)"
    title="Page suivante">
    ›
  </button>
  
  <button 
    class="page-btn nav" 
    [disabled]="currentPage === totalPages" 
    (click)="pageChange.emit(totalPages)"
    title="Dernière page">
    »
  </button>
</div>
