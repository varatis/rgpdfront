@if (totalPages() > 1) {
  <div class="pagination-container">
    <mat-paginator
      [length]="length"
      [pageIndex]="currentPage() - 1"
      [pageSize]="pageSize()"
      [pageSizeOptions]="pageSizeOptions()"
      hidePageSize="true"
      (page)="onPageChange($event)">
    </mat-paginator>
  </div>
}
