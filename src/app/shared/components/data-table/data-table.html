<div class="data-table-container">
  <table class="data-table">
    <thead>
      <tr>
        @for (col of columns(); track col.key) {
          <th [style.flex-grow]="col.width ? '0' : '1'" [style.flex-basis]="col.width || '0'">
            <div class="header-content">{{ col.label }}</div>
          </th>
        }
        <th class="detail-col"></th>
      </tr>
    </thead>
    <tbody>
      @for (row of data(); track row[trackKey()]) {
        <tr (click)="rowClick.emit(row)">
          @for (col of columns(); track col.key) {
            <td [style.flex-grow]="col.width ? '0' : '1'" [style.flex-basis]="col.width || '0'">
              {{ row[col.key] }}
            </td>
          }
          <td class="detail-col">
            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
