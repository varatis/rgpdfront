<div class="filtres-container">

  <div class="filtres-header">
    <h2 class="filtres-title">Filtres</h2>
    <button mat-icon-button type="button" (click)="onClose()" aria-label="Fermer">
      <mat-icon class="close" fontIcon="close" aria-hidden="true"></mat-icon>
    </button>
  </div>

  <div class="filtres-body">

    <mat-form-field appearance="outline">
      <mat-label>Traitement</mat-label>
      <input
        matInput
        id="traitement"
        type="text"
        [(ngModel)]="traitement"
        placeholder="Rechercher un traitement..."
        autocomplete="off"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Gestionnaire</mat-label>
      <input
        matInput
        id="gestionnaire"
        type="text"
        [(ngModel)]="gestionnaire"
        placeholder="Rechercher un gestionnaire..."
        autocomplete="off"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Finalité principale</mat-label>
      <input
        matInput
        id="finalite"
        type="text"
        [(ngModel)]="finalitePrincipale"
        placeholder="Rechercher une finalité..."
        autocomplete="off"
      />
    </mat-form-field>

  </div>

  <div class="filtres-footer">
    <button mat-button type="button" (click)="onReset()">
      Réinitialiser les filtres
    </button>
    <button mat-flat-button color="primary" type="button" (click)="onApply()">
      <mat-icon aria-hidden="true">filter_alt</mat-icon>
      Appliquer les filtres
    </button>
  </div>
</div>
