<div class="table-container" data-testid="_lst_traitement_table">
  <div class="table-header">
    <div
      class="header-cell sortable id"
      role="columnheader"
      [attr.aria-sort]="getAriaSort('idFonctionnel')"
      (click)="toggleSort('idFonctionnel')"
      (keydown.enter)="toggleSort('idFonctionnel')"
      (keydown.space)="toggleSort('idFonctionnel')"
      tabindex="0"
    >
      <span class="header-text">ID</span>
      <svg
        class="sort-icon"
        [class.active]="sortColumn() === 'idFonctionnel'"
        [class.desc]="sortColumn() === 'idFonctionnel' && sortDirection() === 'desc'"
        width="10"
        height="6"
        viewBox="0 0 10 6"
        aria-hidden="true">
        <path
          d="M1 1l4 4 4-4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </div>

    <div
      class="header-cell sortable"
      role="columnheader"
      [attr.aria-sort]="getAriaSort('nom')"
      (click)="toggleSort('nom')"
      (keydown.enter)="toggleSort('nom')"
      (keydown.space)="toggleSort('nom')"
      tabindex="0"
    >
      TRAITEMENT
      <svg
        class="sort-icon"
        [class.active]="sortColumn() === 'nom'"
        [class.desc]="sortColumn() === 'nom' && sortDirection() === 'desc'"
        width="10"
        height="6"
        viewBox="0 0 10 6"
        aria-hidden="true">
        <path
          d="M1 1l4 4 4-4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </div>

    <div
      class="header-cell sortable col-gestionnaire"
      role="columnheader"
      [attr.aria-sort]="getAriaSort('gestionnaireMiseEnOeuvre')"
      (click)="toggleSort('gestionnaireMiseEnOeuvre')"
      (keydown.enter)="toggleSort('gestionnaireMiseEnOeuvre')"
      (keydown.space)="toggleSort('gestionnaireMiseEnOeuvre')"
      tabindex="0"
    >
      GESTIONNAIRE
      <svg
        class="sort-icon"
        [class.active]="sortColumn() === 'gestionnaireMiseEnOeuvre'"
        [class.desc]="sortColumn() === 'gestionnaireMiseEnOeuvre' && sortDirection() === 'desc'"
        width="10"
        height="6"
        viewBox="0 0 10 6"
        aria-hidden="true">
        <path
          d="M1 1l4 4 4-4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </div>

    <div
      class="header-cell sortable col-finalite"
      role="columnheader"
      [attr.aria-sort]="getAriaSort('finalitePrincipale')"
      (click)="toggleSort('finalitePrincipale')"
      (keydown.enter)="toggleSort('finalitePrincipale')"
      (keydown.space)="toggleSort('finalitePrincipale')"
      tabindex="0"
    >
      FINALITÉ PRINCIPALE
      <svg
        class="sort-icon"
        [class.active]="sortColumn() === 'finalitePrincipale'"
        [class.desc]="sortColumn() === 'finalitePrincipale' && sortDirection() === 'desc'"
        width="10"
        height="6"
        viewBox="0 0 10 6"
        aria-hidden="true">
        <path
          d="M1 1l4 4 4-4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </div>

    <div class="header-cell-arrow"></div>
  </div>

  <div class="table-body">

    @if (loading()) {
    <div class="loading-overlay">
      <div class="spinner"></div>
    </div>
    } @else {
      @for (item of data(); track item.idFonctionnel) {
        <div
          class="row"
          [attr.data-testid]="'_lst_traitement_row_' + item.idFonctionnel"
          (click)="onSelect(item)"
          [class.selected]="item.idFonctionnel === selectedId()"
        >
          <div class="cell id" data-testid="_val_traitement_id">

            <mat-icon class="arming-countdown">arming_countdown</mat-icon>

            {{ item.idFonctionnel }}
          </div>
          <div class="cell name" data-testid="_val_traitement_nom">{{ item.nom }}</div>
          <div class="cell col-gestionnaire" data-testid="_val_traitement_gestionnaire">{{ item.gestionnaireMiseEnOeuvre }}</div>
          <div class="cell col-finalite" >{{ item.finalitePrincipale }}</div>
          <div class="arrow">›</div>
        </div>
      }
    }
  </div>
</div>
