<div class="page-container">
  <!-- Layout complet avec header et contenu -->
  <div class="split-layout" [class.split-active]="traitementSelectionne">

    <!-- Partie gauche : Header + Table + Pagination -->
    <div class="left-section">
      <app-header
        [title]="title"
        [icon]="icon"
        [actions]="actions"
        (actionClick)="onActionClick($event)">
      </app-header>

      <app-table-traitement
        [data]="data"
        [loading]="loading"
        [selectedId]="traitementSelectionne?.idFonctionnel"
        (select)="onSelectTraitement($event)"
        (sortChange)="onSortChange($event)">
      </app-table-traitement>

      <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>

    <!-- Partie droite : détails -->
    @if (traitementSelectionne) {
      <div class="right-section">
        <div class="detail-header">
          <div class="detail-actions">
            @if (isAdmin) {
              <!-- Bouton Modifier -->
              <button data-testid="_btn_modifier_traitement" class="icon-btn edit" title="Modifier"
                      (click)="onModifyClick()" [disabled]="!currentTraitementDetails">
                <mat-icon >edit</mat-icon>
              </button>

              <!-- Bouton Supprimer -->
              <button data-testid="_btn_supprimer_traitement" class="icon-btn delete" title="Supprimer"
                      (click)="onDeleteClick()">
                <mat-icon >delete</mat-icon>
              </button>
            }
            <button class="icon-btn close" data-testid="_btn_fermer_detail" (click)="closeDetail()" title="Fermer">
              <mat-icon >close</mat-icon>
            </button>
          </div>
          <div class="detail-title">
            <h2 data-testid="_lib_titre_detail_traitement">{{ traitementSelectionne.idFonctionnel }} - {{ traitementSelectionne.nom }}</h2>
          </div>
        </div>
        <app-details-traitement
          [traitementId]="traitementSelectionne.idFonctionnel"
          (detailsLoaded)="onDetailsLoaded($event)">
        </app-details-traitement>
      </div>
    }
  </div>
</div>

<!-- Modal : Ajouter un traitement -->
@if (showCreateModal) {
  <app-create-traitement-modal
    (closed)="showCreateModal = false"
    (created)="onTraitementCreated()">
  </app-create-traitement-modal>
}

<!-- Modal : Modifier un traitement -->
@if (showEditModal) {
  <app-create-traitement-modal
    [traitementToEdit]="currentTraitementDetails"
    (closed)="showEditModal = false"
    (updated)="onTraitementUpdated()">
  </app-create-traitement-modal>
}
