<div class="page-container">
  <!-- Layout complet avec header et contenu -->
  <div class="split-layout" [class.split-active]="selectedTreatment">

    <!-- Partie gauche : Header + Table + Pagination -->
    <div class="left-section">
      <app-header
        [title]="title"
        [icon]="icon"
        [actions]="actions"
        (actionClick)="onActionClick($event)">
      </app-header>

      <app-table
        [data]="data"
        [selectedId]="selectedTreatment?.id"
        (select)="onSelectTreatment($event)">
      </app-table>

      <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>

    <!-- Partie droite : Header détails + Tabs -->
    @if(selectedTreatment) {
      <div class="right-section">
        <div class="detail-header">
          <div class="detail-title">
            <h2 data-testid="_lib_titre_detail_selected_traitement">{{ selectedTreatment.id }} - {{ selectedTreatment.treatment }}</h2>
          </div>
          <div class="detail-actions">
            <button class="icon-btn edit" data-testid="_btn_modifier_selected_traitement" title="Modifier">
              <mat-icon >edit</mat-icon>
            </button>
            <button class="icon-btn close" data-testid="_btn_fermer_detail" (click)="closeDetail()" title="Fermer">
              <mat-icon >close</mat-icon>
            </button>
          </div>
        </div>

        <app-treatment-tabs
          [treatment]="selectedTreatment">
        </app-treatment-tabs>
      </div>
    }

  </div>
</div>
