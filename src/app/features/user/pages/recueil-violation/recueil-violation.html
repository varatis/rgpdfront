<div class="page-container">
  <!-- Layout complet avec header et contenu -->
  <div class="split-layout" [class.split-active]="selectedViolation">
    <div class="left-section">
      <!-- Header réutilisable -->
      <app-header 
        [title]="title" 
        [icon]="icon" 
        [actions]="actions"
        (actionClick)="onActionClick($event)">
      </app-header>

      <!-- Partie gauche : Tabs + Table + Pagination -->
      <div class="main-content-wrapper">
        <!-- Tabs de statut (En cours / Traité) -->
        <div class="status-tabs-header">
          <button
            class="status-tab-btn"
            [class.active]="activeTab === 'pending'"
            (click)="setActiveTab('pending')"
          >
            En cours de traitement ({{ pendingCount }})
          </button>

          <button
            class="status-tab-btn"
            [class.active]="activeTab === 'treated'"
            (click)="setActiveTab('treated')"
          >
            Traité ({{ treatedCount }})
          </button>
        </div>

        <div class="content-body">
          <div class="table-container">
  <div class="table-header">
    <div class="header-cell sortable" >
      
      <svg class="sort-icon">...</svg>
    </div>
  </div>
  <div class="table-body">
    <div class="row" *ngFor="let item of sortedViolations"
         (click)="onSelectViolation(item)">
     
    </div>
  </div>
</div>
         
          <!-- Empty State -->
          <ng-template #emptyState>
            <div class="empty-state">
              <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24M9.88 9.88L12 12m2.12 2.12L12 12m0 0l-2.12-2.12M12 12l2.12 2.12M22 12c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2s10 4.477 10 10z" 
                      stroke-width="2" stroke-linecap="round"/>
              </svg>
              <p>
                @if(activeTab === 'pending') {
                  Aucune violation en cours de traitement
                } @else {
                  Aucune violation traitée
                }
              </p>
            </div>
          </ng-template>

          <!-- Pagination -->
          <div class="pagination" *ngIf="displayedViolations.length > 0">
            <button class="page-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">«</button>
            <button class="page-btn" [class.active]="currentPage === 1" (click)="goToPage(1)">1</button>
            <button class="page-btn" [class.active]="currentPage === 2" (click)="goToPage(2)">2</button>
            <button class="page-btn" [class.active]="currentPage === 3" (click)="goToPage(3)">3</button>
            <button class="page-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">»</button>
          </div>
        </div>
      </div>
    </div>

   
  </div>
</div>
