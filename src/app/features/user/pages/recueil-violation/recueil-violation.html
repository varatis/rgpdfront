<div class="page-container">
  <!-- Layout complet avec header et contenu -->
  <div class="split-layout" [class.split-active]="selectedTreatment">
       <div class="left-section">
      <app-header 
        [title]="title" 
        [icon]="icon" 
        [actions]="actions"
        (actionClick)="onActionClick($event)">
      </app-header>

    <!-- Partie gauche : Header + Table + Pagination -->
<div class="main-content-wrapper">
    
    <div class="status-tabs-header">
      <button
        class="status-tab-btn"
        [class.active]="activeTab === 'pending'"
        (click)="setActiveTab('pending')"
      >
        En cours de traitement ({{ pendingCount }})
      </button>

      <button
        class="status-tab-btn"
        [class.active]="activeTab === 'treated'"
        (click)="setActiveTab('treated')"
      >
        Traité ({{ treatedCount }})
      </button>
    </div>

    <div class="content-body">
      
    <!-- <app-table 
      *ngIf="displayedViolations.length > 0; else emptyState"
      [data]="displayedViolations"
      [selectedId]="selectedViolation?.id"
      (select)="onSelectViolation($event)">
    </app-table> -->

      <ng-template #emptyState>
        <div class="empty-state">
          <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#A0A1A5" stroke-width="2">
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
            <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
            <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
          </svg>
          <p>Aucune violation en cours de traitement</p>
        </div>
      </ng-template>

    </div>

    </div>


    </div>
</div>
