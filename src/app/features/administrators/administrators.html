<div class="administrateurs-layout" [class.details-open]="selectedAdmin">
  <div class="administrateurs-page">
    <!-- HEADER -->
    <div class="page-header">
      <div class="header-left">
        <div class="icon-wrapper">
            <svg
        class="nav-icon"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="currentColor"
        stroke="currentColor"
      >
        <path

          fill="none"
        />
      </svg>
        </div>
        <h1 class="page-title">Administrateurs</h1>
      </div>

      <div class="header-actions">
        <button class="btn-filter" (click)="onFilterAdmins()">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path
              d="M8 18V12H10V14H18V16H10V18H8ZM0 16V14H6V16H0ZM4 12V10H0V8H4V6H6V12H4ZM8 10V8H18V10H8ZM12 6V0H14V2H18V4H14V6H12ZM0 4V2H10V4H0Z"
              fill="#161617"
            />
          </svg>
          Filtres
        </button>

        <button class="btn-primary" (click)="onCreateAdmin()">+ Ajouter un administrateur</button>
      </div>
    </div>

     <!-- TABLE DES ADMINISTRATEURS -->
    <div class="table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Email</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (a of administrateurs; track a.id) {
            <tr>
              <td>{{ a.nom }}</td>
              <td>{{ a.prenom }}</td>
              <td>{{ a.email }}</td>
              <td class="actions">
              <button class="action-btn" title="Modifier" (click)="onEditAdmin(a)">
                <svg
                  class="icon"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M5 19H6.425L16.2 9.225L14.775 7.8L5 17.575V19ZM3 21V16.75L16.2 3.575C16.4 3.39167 16.6208 3.25 16.8625 3.15C17.1042 3.05 17.3583 3 17.625 3C17.8917 3 18.15 3.05 18.4 3.15C18.65 3.25 18.8667 3.4 19.05 3.6L20.425 5C20.625 5.18333 20.7708 5.4 20.8625 5.65C20.9542 5.9 21 6.15 21 6.4C21 6.66667 20.9542 6.92083 20.8625 7.1625C20.7708 7.40417 20.625 7.625 20.425 7.825L7.25 21H3ZM15.475 8.525L14.775 7.8L16.2 9.225L15.475 8.525Z"
                  />
                </svg>
              </button>
             
              <button class="action-btn delete" title="Supprimer" (click)="onDeleteAdmin(a)">
                <svg
                  class="icon"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M7 21C6.45 21 5.97917 20.8042 5.5875 20.4125C5.19583 20.0208 5 19.55 5 19V6H4V4H9V3H15V4H20V6H19V19C19 19.55 18.8042 20.0208 18.4125 20.4125C18.0208 20.8042 17.55 21 17 21H7ZM17 6H7V19H17V6ZM9 17H11V8H9V17ZM13 17H15V8H13V17Z"
                  />
                </svg>
              </button>
              
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    
        <div class="pagination">
          <button class="page-btn" [disabled]="true">«</button>
          <button class="page-btn active">1</button>
          <button class="page-btn">2</button>
          <button class="page-btn">3</button>
          <button class="page-btn">»</button>
        </div>
  </div>
</div>
