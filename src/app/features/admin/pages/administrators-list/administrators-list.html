<div class="administrateurs-layout" [class.details-open]="selectedAdmin">
  <div class="administrateurs-page">

    <!-- HEADER -->
    <div class="page-header">
      <div class="header-left">
        <div class="icon-wrapper">
          <mat-icon class="nav-icon" >admin_panel_settings</mat-icon>
        </div>
        <h1 class="page-title" data-testid="_lib_titre_administrateurs">Administrateurs</h1>
      </div>

      <div class="header-actions">
        <button class="btn-filter" data-testid="_btn_filtres_administrateurs" (click)="onFilterAdmins()">
          <mat-icon >tune</mat-icon>
          Filtres
        </button>
        <button class="btn-primary" data-testid="_btn_ajouter_administrateur" (click)="onCreateAdmin()">+ Ajouter un administrateur</button>
      </div>
    </div>

    <!-- TABLE DES ADMINISTRATEURS -->
    <div class="table-container">
      <table class="admin-table" data-testid="_lst_administrateurs_table">
        <thead>
          <tr>
            <th data-testid="_lib_col_nom">Nom</th>
            <th data-testid="_lib_col_prenom">Prénom</th>
            <th data-testid="_lib_col_email">Email</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (a of administrateurs; track a.id) {
            <tr [attr.data-testid]="'_lst_administrateurs_row_' + a.id">
              <td data-testid="_val_admin_nom">{{ a.nom }}</td>
              <td data-testid="_val_admin_prenom">{{ a.prenom }}</td>
              <td data-testid="_val_admin_email">{{ a.email }}</td>
              <td class="actions">
                <button class="action-btn" data-testid="_btn_modifier_administrateur" title="Modifier" (click)="onEditAdmin(a)">
                  <mat-icon class="icon" >edit</mat-icon>
                </button>
                <button class="action-btn delete" data-testid="_btn_supprimer_administrateur" title="Supprimer" (click)="onDeleteAdmin(a)">
                  <mat-icon class="icon" >delete</mat-icon>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="pagination" data-testid="_lst_pagination_administrateurs">
      <button class="page-btn" [disabled]="true">«</button>
      <button class="page-btn active">1</button>
      <button class="page-btn">2</button>
      <button class="page-btn">3</button>
      <button class="page-btn">»</button>
    </div>

  </div>
</div>
