<!-- Le titre « Filtres » et la fermeture sont portés par l'en-tête du panneau de détail. -->
<div class="filtres-container">

  <div class="filtres-body">

    <div class="filter-control">
      <label class="filter-label" for="filtre_client_nom" data-testid="_lib_filtre_client_nom">
        Nom du client
      </label>
      <mat-form-field class="filter-field" appearance="outline">
        <input
          matInput
          id="filtre_client_nom"
          type="text"
          data-testid="_inp_filtre_client_nom"
          [(ngModel)]="nom"
          placeholder="Rechercher un client..."
          autocomplete="off"
          (keyup.enter)="onApply()" />
      </mat-form-field>
    </div>

    <div class="filter-control">
      <label class="filter-label" for="filtre_client_version" data-testid="_lib_filtre_client_version">
        Version
      </label>
      <mat-form-field class="filter-field" appearance="outline">
        <input
          matInput
          id="filtre_client_version"
          type="text"
          data-testid="_inp_filtre_client_version"
          [(ngModel)]="version"
          placeholder="Rechercher une version..."
          autocomplete="off"
          (keyup.enter)="onApply()" />
      </mat-form-field>
    </div>

    <div class="filter-control">
      <span class="filter-label" id="filtre-client-date-label" data-testid="_lib_filtre_client_date">
        Date de version
      </span>
      <div class="filter-range" role="group" aria-labelledby="filtre-client-date-label">
        <mat-form-field class="filter-field" appearance="outline">
          <mat-label>Du</mat-label>
          <input
            matInput
            id="filtre_client_date_debut"
            data-testid="_inp_filtre_client_date_debut"
            [matDatepicker]="calendrierDebut"
            [max]="dateVersionFin"
            [(ngModel)]="dateVersionDebut"
            (keyup.enter)="onApply()" />
          <mat-datepicker-toggle matIconSuffix [for]="calendrierDebut" />
          <mat-datepicker #calendrierDebut />
        </mat-form-field>
        <mat-form-field class="filter-field" appearance="outline">
          <mat-label>Au</mat-label>
          <input
            matInput
            id="filtre_client_date_fin"
            data-testid="_inp_filtre_client_date_fin"
            [matDatepicker]="calendrierFin"
            [min]="dateVersionDebut"
            [(ngModel)]="dateVersionFin"
            (keyup.enter)="onApply()" />
          <mat-datepicker-toggle matIconSuffix [for]="calendrierFin" />
          <mat-datepicker #calendrierFin />
        </mat-form-field>
      </div>
      @if (datesIncoherentes) {
        <p class="filter-error" data-testid="_lib_erreur_filtre_client_date">
          La date de début doit précéder la date de fin.
        </p>
      }
    </div>

  </div>

  <div class="filtres-footer">
    <button mat-button type="button" data-testid="_btn_reset_filtre_client" (click)="onReset()">
      Réinitialiser les filtres
    </button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      data-testid="_btn_apply_filtre_client"
      [disabled]="datesIncoherentes"
      (click)="onApply()">
      <mat-icon aria-hidden="true">filter_alt</mat-icon>
      Appliquer les filtres
    </button>
  </div>
</div>
