<app-master-detail-layout
  [title]="pageTitle"
  [iconSvg]="clientIconSvg"
  [actions]="actions"
  [isDetailOpen]="!!selectedClient"
  [isEmpty]="displayedClients.length === 0"
  [detailTitle]="selectedClient ? selectedClient.name : 'Détails Client'"
  >

  <app-page-tabs
    slot="tabs"
    [tabs]="pageTabs"
    [activeTabKey]="activeTab"
    (tabChange)="setActiveTab($event)">
  </app-page-tabs>

  <div slot="list-header" class="collapse-header" (click)="toggleClientsList()">
    <span class="collapse-title">Client</span>
    <svg
      class="chevron"
      [class.open]="clientsListOpen"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </div>
  
  <div slot="list-items" class="clients-list" *ngIf="clientsListOpen">
    @for (c of displayedClients; track c.id) {
    <div class="clients-list-item" (click)="onSelectClient(c)" [class.selected]="c.id === selectedClient?.id">
      <div class="client-info">
        <div class="client-name">{{ c.name }}</div>
      </div>

      <div class="client-actions">
        <button class="action-btn" title="Modifier" (click)="$event.stopPropagation(); onEditClient(c)">...</button>
        <button class="view-btn detail" title="Détails" (click)="$event.stopPropagation(); onSelectClient(c)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </div>
    }
    
    <div slot="pagination" class="pagination">
      </div>
  </div>
  
  <div slot="detail-content">
    <h3>Détails pour {{ selectedClient?.name }}</h3>
    <div class="detail-content">
      <div class="field-group">
        <label>Nom du client</label>
        <p>{{ selectedClient?.name }}</p>
      </div>

      <div class="field-group">
        <label>Description</label>
        <p>{{ selectedClient?.description }}</p>
      </div>

      <div class="field-group">
        <label>UpdatedAt</label>
        <p>{{ selectedClient?.updatedAt }}</p>
      </div>
    
      
  </div>
  
  <div slot="empty-state">
    <!-- <p>Aucun client trouvé pour l'onglet **{{ pageTabs.find(t => t.key === activeTab)?.label }}**.</p> -->
  </div>
