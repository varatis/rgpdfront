<div class="preconisations-layout">
  <div class="preconisations-page">

    <!-- HEADER -->
    <div class="page-header">
      <div class="header-left">
        <div class="icon-wrapper">
          <mat-icon class="nav-icon" >tune</mat-icon>
        </div>
        <h1 class="page-title" data-testid="_lib_titre_preconisations">Gestion des préconisations</h1>
      </div>

      <div class="header-actions">
        <button class="btn-filter" data-testid="_btn_filtres_preconisations" (click)="onFilterPreconisations()">
          <mat-icon >tune</mat-icon>
          Filtres
        </button>
        <button class="btn-primary" data-testid="_btn_ajouter_preconisation" (click)="onCreatePreconisation()">+ Ajouter une préconisation</button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-container">
      <table class="preconisation-table" data-testid="_lst_preconisations_table">
        <thead>
          <tr>
            <th data-testid="_lib_col_preconisation">Préconisation</th>
            <th data-testid="_lib_col_priorite">Priorité</th>
            <th data-testid="_lib_col_complexite">Complexité</th>
            <th class="actions-col"></th>
          </tr>
        </thead>
        <tbody>
          @for (p of preconisations; track p.id) {
            <tr [attr.data-testid]="'_lst_preconisations_row_' + p.id">
              <td data-testid="_val_preco_titre">{{ p.titre }}</td>
              <td>
                <span
                  data-testid="_val_preco_priorite"
                  class="badge"
                  [ngClass]="{
                    'badge-urgent': p.priorite === 'Urgent',
                    'badge-tres-urgent': p.priorite === 'Très urgent'
                  }"
                >{{ p.priorite }}</span>
              </td>
              <td>
                <span
                  data-testid="_val_preco_complexite"
                  class="badge"
                  [ngClass]="{
                    'badge-simple': p.complexite === 'Très simple',
                    'badge-moyen': p.complexite === 'Moyennement complexe',
                    'badge-complexe': p.complexite === 'Complexe'
                  }"
                >{{ p.complexite }}</span>
              </td>
              <td class="actions">
                <button class="view-btn detail" data-testid="_btn_detail_preconisation" title="Détails">
                  <mat-icon >chevron_right</mat-icon>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <!-- PAGINATION -->
    <div class="pagination" data-testid="_lst_pagination_preconisations">
      <button class="page-btn" disabled>&laquo;</button>
      <button class="page-btn active">1</button>
      <button class="page-btn">2</button>
      <button class="page-btn">3</button>
      <button class="page-btn">&raquo;</button>
    </div>

  </div>
</div>
