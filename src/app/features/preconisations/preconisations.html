<div class="preconisations-layout">
  <div class="preconisations-page">

    <!-- HEADER -->
    <div class="page-header">
      <div class="header-left">
        <div class="icon-wrapper">
          <svg
        class="nav-icon"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="currentColor"
        stroke="currentColor"
      >
        <path
          d="M8 18V12H10V14H18V16H10V18H8ZM0 16V14H6V16H0ZM4 12V10H0V8H4V6H6V12H4ZM8 10V8H18V10H8ZM12 6V0H14V2H18V4H14V6H12ZM0 4V2H10V4H0Z"
          fill="currentColor"
        />
      </svg>
        </div>
        <h1 class="page-title">Gestion des préconisations</h1>
      </div>

      <div class="header-actions">
        <button class="btn-filter" (click)="onFilterPreconisations()">
         <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
<path d="M7 12V10H11V12H7ZM3 7V5H15V7H3ZM0 2V0H18V2H0Z" fill="currentColor" />
</svg>
          Filtres
        </button>

        <button class="btn-primary" (click)="onCreatePreconisation()">+ Ajouter une préconisation</button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-container">
      <table class="preconisation-table">
        <thead>
          <tr>
            <th>Préconisation</th>
            <th>Priorité</th>
            <th>Complexité</th>
            <th class="actions-col"></th>
          </tr>
        </thead>
        <tbody>
          @for (p of preconisations; track p.id) {
            <tr>
              <td>{{ p.titre }}</td>
              <td>
                <span class="badge"
                  [ngClass]="{
                    'badge-urgent': p.priorite === 'Urgent',
                    'badge-tres-urgent': p.priorite === 'Très urgent'
                  }"
                  >{{ p.priorite }}</span
                >
              </td>
              <td>
                <span class="badge"
                  [ngClass]="{
                    'badge-simple': p.complexite === 'Très simple',
                    'badge-moyen': p.complexite === 'Moyennement complexe',
                    'badge-complexe': p.complexite === 'Complexe'
                  }"
                  >{{ p.complexite }}</span
                >
              </td>
           
                    <td  class="actions">
                      <button class="view-btn detail" title="Détails">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
                    </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <!-- PAGINATION -->
    <div class="pagination">
      <button class="page-btn" disabled>&laquo;</button>
      <button class="page-btn active">1</button>
      <button class="page-btn">2</button>
      <button class="page-btn">3</button>
      <button class="page-btn">&raquo;</button>
    </div>
  </div>
</div>
