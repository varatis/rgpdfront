<div class="access-denied-container">
  <div class="access-denied-card">
    <img src="assets/images/embleme_b.png" alt="Emblème" width="60" height="60" />
    <h1>Accès refusé</h1>
    <p>Votre compte n'est associé à aucun client. Veuillez contacter votre administrateur.</p>
    <button data-testid="_btn_access_denied_logout" type="button" class="btn-submit" (click)="logout()">
      Se déconnecter
    </button>
  </div>
</div>
