<div class="login-container">
  <div class="login-left">
    <!-- Zone bleue avec logo -->
    <div class="logo-section">
      <div class="logo">
        <img src="assets/images/embleme_b.png" alt="Emblème" width="60" height="60" />
      </div>
    </div>
  </div>

  <div class="login-right">
    <div class="login-form-wrapper">
      <div class="logo-text">
        <img src="assets/images/creative_logo.png" alt="CREATIVE Logo" style="max-width: 100%; height: auto;" />
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Champ Email -->
        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="form-control"
            [class.error]="isFieldInvalid('email')"
            placeholder="Entrez votre email"
          />
          @if(isFieldInvalid('email') ){
          <span class="error-message" >
            Email requis et doit être valide
          </span>
        }
        </div>

        <!-- Champ Mot de passe -->
        <div class="form-group">
          <div class="password-header">
            <label for="password">Mot de passe</label>
            <a href="#" class="forgot-password">Mot de passe oublié ?</a>
          </div>
          <div class="password-input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              class="form-control"
              [class.error]="isFieldInvalid('password')"
              placeholder="Entrez votre mot de passe"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePasswordVisibility()"
              tabindex="-1"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                @if (!showPassword) {
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>}
                 @if (!showPassword) {
                <circle  cx="12" cy="12" r="3"/>
                 }
                  @if (showPassword) {
                <path  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  }
                   @if (showPassword) {
                <line  x1="1" y1="1" x2="23" y2="23"/>
                   }
              </svg>
            </button>
          </div>
          @if ((isFieldInvalid('password'))) {
          <span class="error-message" >
            Mot de passe requis (min. 6 caractères)
          </span>
          }
        </div>

        <!-- Message d'erreur global -->
         @if(errorMessage) {  
        <div class="alert alert-error" >
          {{ errorMessage }}
        </div>
      }

        <!-- Bouton de connexion -->
        <button
          type="submit"
          class="btn-submit"
          [disabled]="isLoading"
        >
        @if(!isLoading) {
          <span >→ Se connecter</span>
          }
          @if (isLoading) {
          <span >Connexion en cours...</span>
          }
        </button>
      </form>

    </div>
  </div>
</div>
