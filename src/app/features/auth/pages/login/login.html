<div class="login-container">
  <div class="login-left">
    <div class="logo-section">
      <div class="logo">
        <img src="assets/images/embleme_b.png" alt="Emblème" width="60" height="60" />
      </div>
    </div>
  </div>

  <div class="login-right">
    <div class="login-form-wrapper">
      <div class="logo-text">
        <img src="assets/images/creative_logo.png" alt="CREATIVE Logo" style="max-width: 100%; height: auto;" />
      </div>

      <div class="keycloak-login-info">
        <p>Vous allez être redirigé vers la page de connexion Keycloak.</p>
        <p>Veuillez utiliser votre compte Keycloak pour vous connecter.</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="login-form">
        <!-- Bouton de connexion Keycloak -->
        <button
          data-testid="_btn_connexion"
          type="submit"
          class="btn-submit"
          [disabled]="isLoading"
        >
          @if(!isLoading) {
            <span>→ Se connecter avec Keycloak</span>
          }
          @if(isLoading) {
            <span>Redirection en cours...</span>
          }
        </button>
      </form>
    </div>
  </div>
</div>
